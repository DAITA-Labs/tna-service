services:
  api:
    build:
      context: .
    image: tna-service:dev
    container_name: tna-service-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Default to production inside the container so structlog emits JSON
      # (which Promtail can parse). Override by exporting APP_ENV before `make up`.
      - APP_ENV=${APP_ENV:-production}
    volumes:
      # Mount the local labeled dataset for `make eval` from inside the container.
      - ./dataset:/app/dataset:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [observability]

  prometheus:
    image: prom/prometheus:latest
    container_name: tna-service-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks: [observability]

  grafana:
    image: grafana/grafana:latest
    container_name: tna-service-grafana
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks: [observability]

  loki:
    image: grafana/loki:2.9.0
    container_name: tna-service-loki
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks: [observability]

  promtail:
    image: grafana/promtail:2.9.0
    container_name: tna-service-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks: [observability]

networks:
  observability: {}

volumes:
  loki-data: {}
